name: phase2a-engineering
on:
  push:
    branches: ['codex/phase2a-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase2a-${{ github.ref }}
  cancel-in-progress: false
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - run: python tools/verify.py
      - run: python tools/verify_phase2a.py
      - run: python tools/test_phase2a_gate.py --output work/phase2a-gate-selftest.json
  full-stack:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.7-alpine
        env: {POSTGRES_USER: echocase, POSTGRES_PASSWORD: phase2a-ci-only, POSTGRES_DB: echocase}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echocase -d echocase"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      ECHOCASE_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=echocase;Username=echocase;Password=phase2a-ci-only
      ConnectionStrings__EchoCase: Host=127.0.0.1;Port=5432;Database=echocase;Username=echocase;Password=phase2a-ci-only
      ECHOCASE_PHASE2_EVIDENCE: ${{ github.workspace }}/evidence/phase2a/fresh/database
      ECHOCASE_BROWSER_EVIDENCE: ../evidence/phase2a/fresh/browser
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: '10.0.300'}
      - uses: actions/setup-node@v5
        with: {node-version: '22.22.2',cache: npm,cache-dependency-path: frontend/package-lock.json}
      - run: dotnet restore --locked-mode
      - run: dotnet test --no-restore --logger 'trx;LogFileName=backend.trx' --results-directory evidence/phase2a/fresh/backend
      - run: dotnet restore experiments/phase2a/DbProbe --locked-mode
      - run: dotnet run --project experiments/phase2a/DbProbe --no-restore -- evidence/phase2a/fresh/database
      - run: dotnet tool restore
      - run: dotnet ef database update --project src/EchoCase.Infrastructure --startup-project src/EchoCase.Api --no-build
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start real API and browser frontend
        run: |
          mkdir -p work
          dotnet run --project src/EchoCase.Api --no-build --no-launch-profile --urls http://127.0.0.1:5080 > work/phase2a-api.log 2>&1 &
          (cd frontend && npm run dev > ../work/phase2a-web.log 2>&1) &
          python scripts/wait_http.py http://127.0.0.1:5080/health/ready http://127.0.0.1:5173/
      - run: npm run contract
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/api/schema.d.ts
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate --json > ../evidence/phase2a/fresh/frontend-audit.json
        working-directory: frontend
      - run: node node_modules/@playwright/test/cli.js test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase2a-full-stack
          path: evidence/phase2a/fresh/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phase2a-debug
          path: |
            work/*.log
            frontend/test-results/
  delivery:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - run: python experiments/phase2a/delivery.py --engine docker --output evidence/phase2a/fresh/delivery --port 6081
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: phase2a-delivery, path: evidence/phase2a/fresh/}
  fresh-evidence:
    needs: [full-stack, delivery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - uses: actions/download-artifact@v5
        with:
          pattern: phase2a-*
          merge-multiple: true
          path: work/phase2a-ci
      - run: python tools/verify_phase2a.py --evidence-root work/phase2a-ci --expected-commit ${{ github.sha }}
