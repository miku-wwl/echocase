name: engineering
on:
  push:
    branches: [main, 'codex/**', '!codex/phase2a-*']
  pull_request:
  workflow_dispatch:
    inputs:
      corrupt_evidence:
        description: 'Controlled drill: remove the manifest in the runner checkout; gate must fail'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.ref }}-${{ github.event_name }}-${{ inputs.corrupt_evidence || false }}
  cancel-in-progress: false
jobs:
  integrity:
    if: ${{ !startsWith(github.head_ref, 'codex/phase2a-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Inject missing manifest (explicit drill only)
        if: ${{ inputs.corrupt_evidence == true }}
        run: python -c "from pathlib import Path; Path('evidence/manifest.json').unlink()"
      - run: python tools/verify.py
      - run: python tools/test_gate.py
  full-stack:
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: echocase
          POSTGRES_PASSWORD: echocase-ci-only
          POSTGRES_DB: echocase
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echocase -d echocase"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      ECHOCASE_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=echocase;Username=echocase;Password=echocase-ci-only
      ConnectionStrings__EchoCase: Host=127.0.0.1;Port=5432;Database=echocase;Username=echocase;Password=echocase-ci-only
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: '10.0.300'}
      - uses: actions/setup-node@v5
        with: {node-version: '22.22.2',cache: npm,cache-dependency-path: frontend/package-lock.json}
      - run: dotnet restore --locked-mode
      - run: dotnet test --no-restore --logger 'trx;LogFileName=backend.trx' --results-directory evidence/backend
      - run: dotnet tool restore
      - run: dotnet ef database update --project src/EchoCase.Infrastructure --startup-project src/EchoCase.Api --no-build
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start local services
        run: |
          mkdir -p work
          dotnet run --project src/EchoCase.Api --no-build --no-launch-profile --urls http://127.0.0.1:5080 > work/api.log 2>&1 &
          (cd frontend && npm run dev > ../work/web.log 2>&1) &
          python scripts/wait_http.py http://127.0.0.1:5080/health/ready http://127.0.0.1:5173/
      - run: npm run contract
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/api/schema.d.ts
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: node node_modules/@playwright/test/cli.js test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-stack-evidence
          path: |
            evidence/backend/backend.trx
            evidence/browser/
            frontend/test-results/
            work/*.log
  container:
    needs: full-stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t echocase:ci .
