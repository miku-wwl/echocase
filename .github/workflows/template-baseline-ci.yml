name: template-baseline-ci
on:
  push:
    branches: ['codex/template-bootstrap-20261112']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-template:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: '10.0.403'}
      - uses: actions/setup-node@v5
        with: {node-version: '22.22.2'}
      - name: Verify all original generated source bytes
        shell: python
        run: |
          import hashlib, json, pathlib
          for entry in json.loads(pathlib.Path('template-provenance/generated-files.json').read_text(encoding='utf-8-sig')):
              path = pathlib.Path(entry['Path'])
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['SHA256'], path
      - name: Restore original template with visible audit warnings
        run: dotnet restore EchoCase.slnx '-p:WarningsNotAsErrors=NU1902%3BNU1903'
      - name: Build original template
        run: dotnet build EchoCase.slnx --no-restore '-p:WarningsNotAsErrors=NU1902%3BNU1903'
      - name: Install original frontend dependencies
        run: npm ci
        working-directory: src/Web/ClientApp
      - name: Build original React and generate NSwag client
        run: npm run build
        working-directory: src/Web/ClientApp
      - name: Prepare original functional and browser environment
        run: |
          docker pull postgres:17.6
          pwsh artifacts/bin/Web.AcceptanceTests/debug/playwright.ps1 install --with-deps chromium
      - name: Execute original template tests
        run: dotnet test EchoCase.slnx --no-build --no-restore --logger trx --results-directory baseline-results --blame-hang-timeout 3m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-template-results
          path: baseline-results/
          retention-days: 7
