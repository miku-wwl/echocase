name: application-ci
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.7-alpine
        env: {POSTGRES_USER: echocase, POSTGRES_PASSWORD: application-ci-only, POSTGRES_DB: echocase}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U echocase -d echocase"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      ECHOCASE_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=echocase;Username=echocase;Password=application-ci-only
      ConnectionStrings__EchoCase: Host=127.0.0.1;Port=5432;Database=echocase;Username=echocase;Password=application-ci-only
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: {dotnet-version: '10.0.300'}
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            test/e2e/package-lock.json
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - name: Restore independent application and test solutions
        run: |
          dotnet restore EchoCase.slnx --locked-mode
          dotnet restore test/EchoCase.Tests.slnx --locked-mode
      - name: Verify dependency direction and compile application
        run: |
          python test/tools/check_boundaries.py
          dotnet build EchoCase.slnx --no-restore
      - name: Unit tests (no database dependency)
        run: dotnet test test/unit/EchoCase.UnitTests --no-restore --logger 'trx;LogFileName=unit.trx' --results-directory test/unit/TestResults
      - name: PostgreSQL integration tests
        run: dotnet test test/integration/EchoCase.IntegrationTests --no-restore --logger 'trx;LogFileName=integration.trx' --results-directory test/integration/TestResults
      - name: Compile optional application query tool (do not benchmark in CI)
        run: dotnet build test/integration/EchoCase.QueryProbe --no-restore
      - name: Compile application publish output
        run: dotnet publish backend/EchoCase.Api --no-restore -c Release -o test/TestResults/publish
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify deterministic NSwag client from checked-in contract
        run: |
          npm run generate-api --prefix frontend
          git diff --exit-code -- frontend/src/api/generated.ts
      - name: Install isolated E2E dependencies
        run: npm ci
        working-directory: test/e2e
      - name: Type check and build frontend
        run: npm run build:verify
        working-directory: frontend
      - name: Verify production output isolation
        run: python test/tools/check_boundaries.py --publish-dir test/TestResults/publish --frontend-dist frontend/dist
      - name: Start application for public contract and browser checks
        run: |
          dotnet tool restore
          dotnet ef database update --project backend/EchoCase.Infrastructure --startup-project backend/EchoCase.Api --no-build
          mkdir -p test/TestResults
          dotnet run --project backend/EchoCase.Api --no-build --no-launch-profile --urls http://127.0.0.1:5080 > test/TestResults/api.log 2>&1 &
          npm run dev --prefix frontend > test/TestResults/web.log 2>&1 &
          python test/tools/wait_http.py http://127.0.0.1:5080/health/ready http://127.0.0.1:5173/
      - name: Check generated public API contract
        run: |
          npm run contract --prefix frontend
          git diff --exit-code -- frontend/openapi.json frontend/src/api/generated.ts
      - name: Focused browser regressions
        run: |
          cd test/e2e
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-test-results
          path: |
            test/unit/TestResults/
            test/integration/TestResults/
            test/e2e/test-results/
          retention-days: 7
