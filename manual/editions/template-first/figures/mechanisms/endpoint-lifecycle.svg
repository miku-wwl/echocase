<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="510" rx="14" fill="#f8faf9"/>
<text x="28" y="42" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">反射发现发生在启动；请求时只执行已构造的路由</text>
<text x="30" y="90" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">启动时</text>
<rect x="35" y="110" width="278" height="75" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="48" y="154" font-family="Book" font-size="22" fill="#173c44" text-anchor="start">程序集导出类型</text>
<rect x="340" y="110" width="278" height="75" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="353" y="154" font-family="Book" font-size="22" fill="#173c44" text-anchor="start">IEndpointGroup</text>
<rect x="645" y="110" width="278" height="75" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="658" y="154" font-family="Book" font-size="22" fill="#173c44" text-anchor="start">RoutePrefix / Map</text>
<line x1="318" y1="150" x2="335" y2="150" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="623" y1="150" x2="640" y2="150" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="215" width="888" height="76" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="54" y="247" font-family="BookBold" font-size="22" fill="#173c44" text-anchor="start">MapPut(SaveNotes, pattern) → WithName(&quot;SaveNotes&quot;)</text>
<text x="54" y="276" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">路由 / 授权 / 限流元数据 → OpenAPI operationId</text>
<line x1="780" y1="188" x2="780" y2="209" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="30" y1="322" x2="930" y2="322" stroke="#c8d7d3" stroke-width="2"/>
<text x="30" y="362" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">每次请求</text>
<text x="35" y="413" font-family="Book" font-size="22" fill="#173c44" text-anchor="start">匹配路由 → 绑定值 / scoped 依赖 → 命名委托 → Send → 执行 IResult</text>
<text x="35" y="466" font-family="Book" font-size="20" fill="#24766e" text-anchor="start">启动未执行领域；请求不重扫程序集；改方法名可能改变生成客户端名称。</text>
</svg>
