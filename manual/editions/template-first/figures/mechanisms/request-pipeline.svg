<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="960" rx="14" fill="#f8faf9"/>
<text x="28" y="42" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">SaveNotes：进入、短路、事务与成功回返</text>
<line x1="69" y1="83" x2="69" y2="850" stroke="#c8d7d3" stroke-width="2"/>
<rect x="48" y="90" width="36" height="32" rx="9" fill="#24766e" stroke="#24766e"/>
<text x="66" y="114" font-family="BookBold" font-size="19" fill="#ffffff" text-anchor="middle">1</text>
<rect x="110" y="78" width="808" height="66" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="128" y="106" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">HTTP 外围边界</text>
<text x="128" y="133" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">安全头 / TraceId / 异常映射；响应未开始才可重写</text>
<line x1="75" y1="128" x2="75" y2="158" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="168" width="36" height="32" rx="9" fill="#24766e" stroke="#24766e"/>
<text x="66" y="192" font-family="BookBold" font-size="19" fill="#ffffff" text-anchor="middle">2</text>
<rect x="110" y="156" width="808" height="66" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="128" y="184" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">Routing → Authentication</text>
<text x="128" y="211" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">端点元数据；Cookie 建立可信 principal</text>
<line x1="75" y1="206" x2="75" y2="236" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="246" width="36" height="32" rx="9" fill="#24766e" stroke="#24766e"/>
<text x="66" y="270" font-family="BookBold" font-size="19" fill="#ffffff" text-anchor="middle">3</text>
<rect x="110" y="234" width="808" height="66" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="128" y="262" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">RateLimiter → Authorization → CSRF</text>
<text x="128" y="289" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">限频 / 登录要求 / 写请求令牌；可在端点前停止</text>
<line x1="75" y1="284" x2="75" y2="314" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="324" width="36" height="32" rx="9" fill="#24766e" stroke="#24766e"/>
<text x="66" y="348" font-family="BookBold" font-size="19" fill="#ffffff" text-anchor="middle">4</text>
<rect x="110" y="312" width="808" height="66" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="128" y="340" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">绑定 → 命名端点 SaveNotes</text>
<text x="128" y="367" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">route + body + ISender；解析 Key / Version；Send</text>
<line x1="75" y1="362" x2="75" y2="392" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="402" width="36" height="32" rx="9" fill="#24766e" stroke="#24766e"/>
<text x="66" y="426" font-family="BookBold" font-size="19" fill="#ffffff" text-anchor="middle">5</text>
<rect x="110" y="390" width="808" height="66" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="128" y="418" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">Logging 预处理器</text>
<text x="128" y="445" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">可能读取用户名；位于内层异常行为之外</text>
<line x1="75" y1="440" x2="75" y2="470" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="480" width="36" height="32" rx="9" fill="#24766e" stroke="#24766e"/>
<text x="66" y="504" font-family="BookBold" font-size="19" fill="#ffffff" text-anchor="middle">6</text>
<rect x="110" y="468" width="808" height="66" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="128" y="496" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">MediatR 四层行为</text>
<text x="128" y="523" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">UnhandledException → Authorization → Validation → Performance</text>
<line x1="75" y1="518" x2="75" y2="548" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="558" width="36" height="32" rx="9" fill="#24766e" stroke="#24766e"/>
<text x="66" y="582" font-family="BookBold" font-size="19" fill="#ffffff" text-anchor="middle">7</text>
<rect x="110" y="546" width="808" height="66" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="128" y="574" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">Handler → InvestigationService</text>
<text x="128" y="601" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">IUser 提供 owner；构造指纹与领域回调</text>
<line x1="75" y1="596" x2="75" y2="626" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="636" width="36" height="32" rx="9" fill="#24766e" stroke="#24766e"/>
<text x="66" y="660" font-family="BookBold" font-size="19" fill="#ffffff" text-anchor="middle">8</text>
<rect x="110" y="624" width="808" height="66" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="128" y="652" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">Store 开始事务，取得同键锁</text>
<text x="128" y="679" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">加载 owner/id → 查回执 → 比较预期版本</text>
<line x1="75" y1="674" x2="75" y2="704" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="714" width="36" height="32" rx="9" fill="#24766e" stroke="#24766e"/>
<text x="66" y="738" font-family="BookBold" font-size="19" fill="#ffffff" text-anchor="middle">9</text>
<rect x="110" y="702" width="808" height="66" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="128" y="730" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">apply → 领域根 → EF 保存</text>
<text x="128" y="757" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">根与子变化；加入 Audit / Receipt；SaveChanges</text>
<line x1="75" y1="752" x2="75" y2="782" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="48" y="792" width="36" height="32" rx="9" fill="#24766e" stroke="#24766e"/>
<text x="66" y="816" font-family="BookBold" font-size="19" fill="#ffffff" text-anchor="middle">10</text>
<rect x="110" y="780" width="808" height="66" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="128" y="808" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">Commit 成功 → 调用栈回返</text>
<text x="128" y="835" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">Performance 日志 → SessionView → ETag / Ok → JSON</text>
<line x1="928" y1="624" x2="943" y2="624" stroke="#627477" stroke-width="2"/>
<line x1="943" y1="624" x2="943" y2="812" stroke="#627477" stroke-width="2"/>
<line x1="943" y1="812" x2="928" y2="812" stroke="#627477" stroke-width="2"/>
<text x="30" y="895" font-family="Book" font-size="20" fill="#24766e" text-anchor="start">事务只覆盖 8–10 中提交前的 Store 工作；不是整个 HTTP 或 MediatR 链。</text>
<text x="30" y="935" font-family="Book" font-size="20" fill="#627477" text-anchor="start">成功提交不保证浏览器收到正文；任一短路都会使内层尚未执行的阶段停下。</text>
</svg>
