<svg xmlns="http://www.w3.org/2000/svg" width="960" height="535" viewBox="0 0 960 535">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="535" rx="14" fill="#f8faf9"/>
<text x="28" y="42" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">三道边界回答不同问题，不能相互代替</text>
<rect x="30" y="85" width="900" height="111" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="48" y="120" font-family="BookBold" font-size="24" fill="#173c44" text-anchor="start">HTTP</text>
<text x="250" y="120" font-family="Book" font-size="22" fill="#173c44" text-anchor="start">Cookie / RequireAuthorization / CSRF</text>
<text x="250" y="162" font-family="Book" font-size="21" fill="#173c44" text-anchor="start">浏览器是谁，写入上下文是否有效</text>
<line x1="130" y1="198" x2="130" y2="213" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="213" width="900" height="111" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="48" y="248" font-family="BookBold" font-size="24" fill="#173c44" text-anchor="start">MediatR</text>
<text x="250" y="248" font-family="Book" font-size="22" fill="#173c44" text-anchor="start">Authorize 属性 + IUser</text>
<text x="250" y="290" font-family="Book" font-size="21" fill="#173c44" text-anchor="start">是否允许进入受保护用例</text>
<line x1="130" y1="326" x2="130" y2="341" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="341" width="900" height="111" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="48" y="376" font-family="BookBold" font-size="24" fill="#173c44" text-anchor="start">Store 事务</text>
<text x="250" y="376" font-family="Book" font-size="22" fill="#173c44" text-anchor="start">WHERE Id AND OwnerId → 回执</text>
<text x="250" y="418" font-family="Book" font-size="21" fill="#173c44" text-anchor="start">现在是否仍可访问这一份调查</text>
<text x="30" y="508" font-family="Book" font-size="20" fill="#24766e" text-anchor="start">当前没有团队/管理员业务授权，也没有数据库 RLS；资源过滤依赖统一 Store。</text>
</svg>
