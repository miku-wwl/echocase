<svg xmlns="http://www.w3.org/2000/svg" width="960" height="475" viewBox="0 0 960 475">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="475" rx="14" fill="#f8faf9"/>
<text x="28" y="42" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">跟踪器接受变化，早于显式事务最终提交</text>
<text x="30" y="98" font-family="BookBold" font-size="22" fill="#173c44" text-anchor="start">对象 / EF</text>
<text x="30" y="253" font-family="BookBold" font-size="22" fill="#173c44" text-anchor="start">数据库事务</text>
<text x="230" y="97" font-family="BookBold" font-size="21" fill="#173c44" text-anchor="start">修改 / 检测</text>
<text x="230" y="139" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">Modified</text>
<text x="485" y="97" font-family="BookBold" font-size="21" fill="#173c44" text-anchor="start">SaveChanges 返回</text>
<text x="485" y="139" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">Unchanged / Original = 5</text>
<text x="758" y="97" font-family="BookBold" font-size="21" fill="#173c44" text-anchor="start">Commit 成功</text>
<text x="758" y="139" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">可向上确认</text>
<line x1="220" y1="195" x2="918" y2="195" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="225" y="229" width="510" height="107" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="242" y="268" font-family="BookBold" font-size="22" fill="#173c44" text-anchor="start">事务已开；SQL 成功但未最终提交</text>
<text x="242" y="310" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">此时失败仍不能把跟踪状态当作持久证明</text>
<line x1="741" y1="284" x2="810" y2="284" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="817" y="284" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">提交</text>
<text x="30" y="391" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">SaveChanges 默认 AcceptAllChanges：接受对象快照，不是替外部事务作承诺。</text>
<text x="30" y="436" font-family="Book" font-size="20" fill="#24766e" text-anchor="start">Store 只在 CommitAsync 成功后返回；失败上下文不继续服务下一次业务。</text>
</svg>
