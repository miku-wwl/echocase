<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="550" rx="14" fill="#f8faf9"/>
<text x="28" y="42" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">持有旧回执，不代表现在仍拥有资源</text>
<text x="30" y="92" font-family="BookBold" font-size="22" fill="#173c44" text-anchor="start">历史提交</text>
<text x="255" y="92" font-family="Book" font-size="22" fill="#173c44" text-anchor="start">Alice + Key K → 笔记成功 → Receipt K 留存</text>
<line x1="30" y1="116" x2="930" y2="116" stroke="#c8d7d3" stroke-width="2"/>
<rect x="30" y="145" width="900" height="80" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="48" y="180" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">测试夹具 SQL 将 OwnerId 改为 Bob</text>
<text x="48" y="208" font-family="Book" font-size="20" fill="#627477" text-anchor="start">用于构造反例；没有生产转移 API</text>
<text x="30" y="270" font-family="BookBold" font-size="22" fill="#173c44" text-anchor="start">Alice 原样重放</text>
<line x1="220" y1="263" x2="305" y2="263" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="315" y="242" width="600" height="98" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="335" y="277" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">先查当前 Id + Alice → 不可见 → 404</text>
<text x="335" y="312" font-family="Book" font-size="21" fill="#173c44" text-anchor="start">到此停止；不读取旧 Session 回执</text>
<line x1="640" y1="344" x2="640" y2="382" stroke="#af543c" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="315" y="390" width="600" height="79" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="335" y="423" font-family="Book" font-size="22" fill="#af543c" text-anchor="start">若先重放 Receipt K，就会泄露旧资源</text>
<text x="335" y="451" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">Authorize 只能确认她仍已登录，阻止不了此旁路</text>
<text x="30" y="518" font-family="Book" font-size="21" fill="#24766e" text-anchor="start">实际回归同时确认：Bob 可见成功笔记，原回执仍只一份。</text>
</svg>
