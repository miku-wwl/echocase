<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="250" rx="14" fill="#f8faf9"/>
<text x="28" y="42" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">评审一个改动时，沿承诺逆向追问</text>
<rect x="28.0" y="70" width="288.0" height="150" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="46.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">用户承诺</text>
<text x="46.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">保存指的是哪一代输入？</text>
<text x="46.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">失败后还保留什么？</text>
<text x="46.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">用户能否看见并发变化？</text>
<rect x="336.0" y="70" width="288.0" height="150" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="354.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">协议与事务</text>
<text x="354.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">重试是否保持原意图？</text>
<text x="354.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">根和子是否同提交？</text>
<text x="354.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">读取快照支持何种结论？</text>
<rect x="644.0" y="70" width="288.0" height="150" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="662.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">维护与边界</text>
<text x="662.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">规则由哪个对象拥有？</text>
<text x="662.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">新增复杂度解决何种反例？</text>
<text x="662.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">哪项假设变化会推翻选择？</text>
</svg>