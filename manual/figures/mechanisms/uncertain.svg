<svg xmlns="http://www.w3.org/2000/svg" width="960" height="274" viewBox="0 0 960 274">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="274" rx="14" fill="#f8faf9"/>
<text x="28" y="42" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">HTTP 成功与浏览器确认之间仍有缺口</text>
<rect x="28.0" y="70" width="288.0" height="174" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="46.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">服务器可能已提交</text>
<text x="46.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">数据库事务提交完成</text>
<text x="46.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">回执已持久化</text>
<text x="46.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">响应字节却未到达浏览器</text>
<rect x="336.0" y="70" width="288.0" height="174" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="354.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">浏览器状态 0</text>
<text x="354.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">fetch 失败</text>
<text x="354.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">或成功正文无法解析</text>
<text x="354.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">保留 mutation.variables</text>
<rect x="644.0" y="70" width="288.0" height="174" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="662.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">恢复含义</text>
<text x="662.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">同一次操作原样重试</text>
<text x="662.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">得到历史回执</text>
<text x="662.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">若资源更新，草稿继续待确</text>
<text x="662.0" y="224" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">认</text>
