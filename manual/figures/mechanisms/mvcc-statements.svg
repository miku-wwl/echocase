<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="414" rx="14" fill="#f8faf9"/>
<text x="28" y="40" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">Read Committed：一个事务内也可能看到两个版本</text>
<text x="25" y="126" font-family="BookBold" font-size="21" fill="#173c44" text-anchor="start">事务 A</text>
<line x1="165" y1="140" x2="928" y2="140" stroke="#c8d7d3" stroke-width="2"/>
<text x="25" y="244" font-family="BookBold" font-size="21" fill="#173c44" text-anchor="start">事务 B</text>
<line x1="165" y1="258" x2="928" y2="258" stroke="#c8d7d3" stroke-width="2"/>
<rect x="180" y="78" width="172" height="90" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="192" y="104" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">① SELECT 见</text>
<text x="192" y="129" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">v4</text>
<rect x="365" y="196" width="172" height="90" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="377" y="222" font-family="Book" font-size="19" fill="#af543c" text-anchor="start">② 更新并提交</text>
<text x="377" y="247" font-family="Book" font-size="19" fill="#af543c" text-anchor="start">v5</text>
<rect x="550" y="78" width="172" height="90" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="562" y="104" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">③ 新 SELECT</text>
<text x="562" y="129" font-family="Book" font-size="19" fill="#173c44" text-anchor="start">见 v5</text>
<line x1="174" y1="364" x2="924" y2="364" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<text x="28" y="399" font-family="Book" font-size="18" fill="#627477" text-anchor="start">时间向右；编号表示发生顺序，不表示耗时比例。</text>
</svg>