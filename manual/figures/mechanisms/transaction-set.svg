<svg xmlns="http://www.w3.org/2000/svg" width="960" height="304" viewBox="0 0 960 304">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="304" rx="14" fill="#f8faf9"/>
<text x="28" y="42" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">原子提交的单位不是单条 UPDATE</text>
<rect x="28.0" y="70" width="288.0" height="204" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="46.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">根与子</text>
<text x="46.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">Investigations：Version</text>
<text x="46.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">/ 时间</text>
<text x="46.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">Links：类型 / 解释 / 时</text>
<text x="46.0" y="224" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">间</text>
<text x="46.0" y="254" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">同一次业务决定</text>
<rect x="336.0" y="70" width="288.0" height="204" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="354.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">可观察承诺</text>
<text x="354.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">Audit：此版本发生何种操</text>
<text x="354.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">作</text>
<text x="354.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">Receipt：该意图得到何结</text>
<text x="354.0" y="224" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">果</text>
<text x="354.0" y="254" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">响应仅在提交成功后返回</text>
<rect x="644.0" y="70" width="288.0" height="204" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="662.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">任一失败</text>
<text x="662.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">版本条件影响 0 行</text>
<text x="662.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">或版本审计唯一键冲突</text>
<text x="662.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">整个事务回滚，避免半条事</text>
<text x="662.0" y="224" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">实</text>
</svg>