<text x="354.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">业务语义</text>
<text x="354.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">Domain：Active 才能修改</text>
