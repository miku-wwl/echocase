<text x="354.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">基于已读取的版本</text>
<rect x="644.0" y="70" width="288.0" height="150" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
