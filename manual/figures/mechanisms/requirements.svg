<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="250" rx="14" fill="#f8faf9"/>
<text x="28" y="42" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">把一句功能要求拆成可判断的边界</text>
<rect x="28.0" y="70" width="288.0" height="150" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="46.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">意图</text>
<text x="46.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">调查员希望修订关系</text>
<text x="46.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">保留端点和稳定身份</text>
<text x="46.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">写明判断改变的理由</text>
<rect x="336.0" y="70" width="288.0" height="150" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="354.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">前提</text>
