<line x1="700.5" y1="153" x2="723.5" y2="153" stroke="#627477" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="728.5" y="78" width="203.5" height="150" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="746.5" y="113" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">Commit</text>
<text x="746.5" y="142" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">更新 DOM</text>
<text x="746.5" y="172" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">再执行 Effect</text>
