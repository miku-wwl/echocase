<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="250" rx="14" fill="#f8faf9"/>
<text x="28" y="42" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">同一个 Version，三个不同来源的值</text>
<rect x="28.0" y="70" width="288.0" height="150" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="46.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">Original = 4</text>
<text x="46.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">B 加载时记录</text>
<text x="46.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">没有因 A 提交而改变</text>
<text x="46.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">进入 WHERE 的预期值</text>
<rect x="336.0" y="70" width="288.0" height="150" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="354.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">Current = 5</text>
<text x="354.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">B 自己的领域决定</text>
<text x="354.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">只是待写入的值</text>
<text x="354.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">进入 SET 的新值</text>
<rect x="644.0" y="70" width="288.0" height="150" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="662.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">Database = 5</text>
<text x="662.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">A 已提交的结果</text>
<text x="662.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">数值与 B 想写的一样</text>
<text x="662.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">来源不同，B 仍应冲突</text>
</svg>