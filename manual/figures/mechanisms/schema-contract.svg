<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#627477"/></marker></defs>
<rect width="960" height="250" rx="14" fill="#f8faf9"/>
<text x="28" y="42" font-family="BookBold" font-size="26" fill="#173c44" text-anchor="start">一次加列，存在三个时间维度的合同</text>
<rect x="28.0" y="70" width="288.0" height="150" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="46.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">旧数据库行</text>
<text x="46.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">无解释与修订时间</text>
<text x="46.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">迁移后两列均为 null</text>
<text x="46.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">不编造历史修订事实</text>
<rect x="336.0" y="70" width="288.0" height="150" rx="9" fill="#edf4f2" stroke="#c8d7d3"/>
<text x="354.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">新业务操作</text>
<text x="354.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">解释经 Trim 后校验</text>
<text x="354.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">解释与时间成对写入</text>
<text x="354.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">不改变原关联身份</text>
<rect x="644.0" y="70" width="288.0" height="150" rx="9" fill="#f8f2e7" stroke="#c8d7d3"/>
<text x="662.0" y="105" font-family="BookBold" font-size="23" fill="#173c44" text-anchor="start">旧 JSON 回执</text>
<text x="662.0" y="134" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">可能缺少新增字段</text>
<text x="662.0" y="164" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">LinkView 可选默认 null</text>
<text x="662.0" y="194" font-family="Book" font-size="20" fill="#173c44" text-anchor="start">重放仍描述过去的结果</text>
</svg>