services:
  db:
    image: docker.io/library/postgres:17.7-alpine
    environment:
      POSTGRES_USER: echocase
      POSTGRES_PASSWORD: ${ECHOCASE_DB_PASSWORD:?Set ECHOCASE_DB_PASSWORD for your local lab}
      POSTGRES_DB: echocase
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echocase -d echocase"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 384m
  migrate:
    build: .
    image: localhost/echocase:lab
    command: ["--migrate"]
    environment:
      ConnectionStrings__EchoCase: Host=db;Database=echocase;Username=echocase;Password=${ECHOCASE_DB_PASSWORD}
    depends_on:
      db: {condition: service_healthy}
  app:
    image: localhost/echocase:lab
    ports: ["127.0.0.1:6080:8080"]
    environment:
      # HTTP is restricted to a loopback-only local lab. Use Production + HTTPS outside it.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__EchoCase: Host=db;Database=echocase;Username=echocase;Password=${ECHOCASE_DB_PASSWORD}
    volumes: ["keys:/home/app/.aspnet/DataProtection-Keys"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 384m
volumes:
  pgdata:
  keys:
